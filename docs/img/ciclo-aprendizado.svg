<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Ciclo da máquina de aprendizado: extrair, revisar, aprender e melhorar">
  <!-- Fundo branco: o desenho fica legível também no tema escuro do GitHub/VS Code -->
  <rect width="880" height="420" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1257c9"/>
    </marker>
  </defs>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0a3a8c">Ciclo da máquina de aprendizado</text>

  <!-- 1. Extrair -->
  <rect x="40" y="70" width="330" height="118" rx="10" fill="#f3f7fd" stroke="#1257c9" stroke-width="1.5"/>
  <text x="60" y="100" font-size="17" font-weight="700" fill="#0a3a8c">1. EXTRAIR</text>
  <text x="60" y="126" font-size="13.5" fill="#16233a">ExtracaoVaga / ExtracaoCurso / ExtracaoCurriculo</text>
  <text x="60" y="148" font-size="13.5" fill="#3f4a5c">regras + MaquinaAprendizado::decidir()</text>
  <text x="60" y="170" font-size="13.5" fill="#3f4a5c">→ formulário preenchido + relatório</text>

  <!-- 2. Revisar -->
  <rect x="510" y="70" width="330" height="118" rx="10" fill="#f3f7fd" stroke="#1257c9" stroke-width="1.5"/>
  <text x="530" y="100" font-size="17" font-weight="700" fill="#0a3a8c">2. REVISAR</text>
  <text x="530" y="126" font-size="13.5" fill="#16233a">A pessoa confere, corrige e salva</text>
  <text x="530" y="148" font-size="13.5" fill="#3f4a5c">a sugestão fica na sessão (AprendeComRevisao)</text>
  <text x="530" y="170" font-size="13.5" fill="#3f4a5c">o formulário leva o código da sugestão</text>

  <!-- 3. Aprender -->
  <rect x="510" y="262" width="330" height="118" rx="10" fill="#e4f3e8" stroke="#17692f" stroke-width="1.5"/>
  <text x="530" y="292" font-size="17" font-weight="700" fill="#17692f">3. APRENDER</text>
  <text x="530" y="318" font-size="13.5" fill="#16233a">CorrecaoHumana: sugestão × o que foi salvo</text>
  <text x="530" y="340" font-size="13.5" fill="#3f4a5c">cada diferença vira uma lição no banco</text>
  <text x="530" y="362" font-size="13.5" fill="#3f4a5c">(AprendizadoDAO: +1 nas palavras da resposta)</text>

  <!-- 4. Melhorar -->
  <rect x="40" y="262" width="330" height="118" rx="10" fill="#fff6d6" stroke="#6b4e00" stroke-width="1.5"/>
  <text x="60" y="292" font-size="17" font-weight="700" fill="#6b4e00">4. MELHORAR</text>
  <text x="60" y="318" font-size="13.5" fill="#16233a">NaiveBayes usa as lições na próxima leitura</text>
  <text x="60" y="340" font-size="13.5" fill="#3f4a5c">só decide depois de acertar 90% das provas;</text>
  <text x="60" y="362" font-size="13.5" fill="#3f4a5c">na dúvida, vale a regra</text>

  <!-- Setas do ciclo -->
  <line x1="374" y1="129" x2="504" y2="129" stroke="#1257c9" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="675" y1="192" x2="675" y2="256" stroke="#1257c9" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="506" y1="321" x2="376" y2="321" stroke="#1257c9" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="205" y1="258" x2="205" y2="194" stroke="#1257c9" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="440" y="118" text-anchor="middle" font-size="12.5" fill="#5f6b7c">sugestão</text>
  <text x="440" y="310" text-anchor="middle" font-size="12.5" fill="#5f6b7c">lições</text>
  <text x="690" y="229" font-size="12.5" fill="#5f6b7c">salvar</text>
  <text x="193" y="229" text-anchor="end" font-size="12.5" fill="#5f6b7c">próximo anúncio</text>
</svg>
